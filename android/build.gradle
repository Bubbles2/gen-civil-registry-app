// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 28
        compileSdkVersion = 35
        targetSdkVersion = 33
        // Honoured by bcrypt-react-native, react-native-screens, gesture-handler,
        // safe-area-context. Without it bcrypt pins Kotlin 1.3.50, which AGP 7.4 rejects.
        kotlinVersion = "1.9.25"
        // RN 0.76's New Architecture compiles its codegen C++ against folly, which
        // uses C++20 concepts (std::regular): NDK 25's clang 14 does not have them
        // and the build fails in F14Table.h. 27.1 is what the RN 0.76 template
        // pins. 25.1 was only held for Realm, which Phase 13 removed.
        ndkVersion = "27.1.12297006"


    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.6.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        // RxLogs (PLog) is only published on jitpack.
        maven { url 'https://www.jitpack.io' }
    }
}
