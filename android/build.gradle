// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 28
        compileSdkVersion = 34
        targetSdkVersion = 33
        // Honoured by bcrypt-react-native, react-native-screens, gesture-handler,
        // safe-area-context. Without it bcrypt pins Kotlin 1.3.50, which AGP 7.4 rejects.
        kotlinVersion = "1.9.25"
        // Realm 12 and react-native-screens compile native code. AGP 8.5 would default to
        // NDK 26.1, which is not installed here; 25.1 is, and is what Realm has built with.
        ndkVersion = "25.1.8937393"


    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.5.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        // RxLogs (PLog) is only published on jitpack.
        maven { url 'https://www.jitpack.io' }
    }
}
